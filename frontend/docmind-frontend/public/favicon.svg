<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DocMind</title>
  <desc id="desc">A bold geometric letter D with a subtle electric-blue page fold, on a transparent canvas.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66D5FF"/>
      <stop offset="1" stop-color="#3978FF"/>
    </linearGradient>
  </defs>
  <!-- The rounded tile is intentional; the area outside it remains transparent. -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="#111318"/>
  <!-- One bold, readable D silhouette. -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="M132 112h126c108 0 174 56 174 144S366 400 258 400H132V112Zm82 76v136h44c58 0 91-23 91-68s-33-68-91-68h-44Z"/>
  <!-- Small folded-page cut/accent: a recognizable detail without clutter. -->
  <path d="M304 112h-1l-1 77h77c-7-35-32-63-75-77Z" fill="url(#accent)"/>
</svg>
